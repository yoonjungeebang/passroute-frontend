name: Deploy to Vercel

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Resolve version
        id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION#v}"
          fi

          TAG="v${VERSION}"

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "resolved: version=$VERSION tag=$TAG"

  notify-start:
    needs: [resolve]
    runs-on: ubuntu-latest
    steps:
      - name: Discord 배포 시작 알림
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ needs.resolve.outputs.tag }}
          ACTOR: ${{ github.actor }}
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          PAYLOAD=$(jq -n \
            --arg version "$VERSION" \
            --arg actor "$ACTOR" \
            --arg timestamp "$TIMESTAMP" \
            '{
              embeds: [{
                title: ("🚀 PassRoute " + $version + " 배포 시작"),
                color: 3447003,
                fields: [
                  {name: "버전", value: $version, inline: true},
                  {name: "배포자", value: $actor, inline: true},
                  {name: "대상", value: "Vercel Production"}
                ],
                timestamp: $timestamp
              }]
            }')

          curl -f -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK"

  deploy:
    needs: [resolve, notify-start]
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PASSROUTE_PROD_BACKEND_URL: ${{ secrets.PASSROUTE_PROD_BACKEND_URL }}
      NEXT_PUBLIC_AI_WS_URL: ${{ secrets.PASSROUTE_PROD_AI_WS_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  notify-end:
    needs: [resolve, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Discord 배포 결과 알림
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERSION: ${{ needs.resolve.outputs.tag }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$DEPLOY_RESULT" == "success" ]; then
            COLOR=5763719
            TITLE="✅ PassRoute $VERSION 배포 성공"
          else
            COLOR=15548997
            TITLE="❌ PassRoute $VERSION 배포 실패"
          fi

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --argjson color "$COLOR" \
            --arg version "$VERSION" \
            --arg actor "$ACTOR" \
            --arg site "https://www.passroute.site" \
            --arg timestamp "$TIMESTAMP" \
            '{
              embeds: [{
                title: $title,
                color: $color,
                fields: [
                  {name: "버전", value: $version, inline: true},
                  {name: "배포자", value: $actor, inline: true},
                  {name: "사이트", value: $site}
                ],
                timestamp: $timestamp
              }]
            }')

          curl -f -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK"
